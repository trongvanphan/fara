# Magentic-UI Configuration - Custom LLM Provider
# Sử dụng LLM provider bất kỳ thay vì OpenAI GPT-4o
#
# Hầu hết các LLM provider đều hỗ trợ OpenAI-compatible API
# Bạn chỉ cần thay đổi: base_url, api_key, và model name

# =============================================================
# CUSTOM LLM PROVIDER - THAY ĐỔI THÔNG TIN Ở ĐÂY
# =============================================================

# Ví dụ các provider phổ biến:
#
# OpenRouter:
#   base_url: https://openrouter.ai/api/v1
#   model: anthropic/claude-3.5-sonnet, google/gemini-pro, meta-llama/llama-3.1-70b-instruct
#
# Together AI:
#   base_url: https://api.together.xyz/v1
#   model: meta-llama/Llama-3.2-90B-Vision-Instruct-Turbo, Qwen/Qwen2.5-72B-Instruct-Turbo
#
# Groq:
#   base_url: https://api.groq.com/openai/v1
#   model: llama-3.3-70b-versatile, mixtral-8x7b-32768
#
# Fireworks:
#   base_url: https://api.fireworks.ai/inference/v1
#   model: accounts/fireworks/models/llama-v3p1-70b-instruct
#
# Anthropic (cần provider khác):
#   provider: AnthropicChatCompletionClient
#   model: claude-3-5-sonnet-20241022

# -------------------------------------------------------------
# ĐIỀN THÔNG TIN CỦA BẠN VÀO ĐÂY:
# -------------------------------------------------------------
custom_llm: &custom_llm
  provider: OpenAIChatCompletionClient
  config:
    # === THAY ĐỔI 3 DÒNG DƯỚI ĐÂY ===
    base_url: "https://YOUR_PROVIDER_URL/v1"  # URL của LLM provider
    api_key: "YOUR_API_KEY_HERE"               # API key của bạn
    model: "your-model-name"                   # Tên model (vd: gpt-4o, claude-3.5-sonnet, llama-3.1-70b)
    # ================================
    max_retries: 5
    model_info:
      vision: true           # Set false nếu model không hỗ trợ vision
      function_calling: true # Set false nếu model không hỗ trợ function calling
      json_output: true
      family: "unknown"
      structured_output: false
      multiple_system_messages: false

# Có thể dùng model nhỏ hơn cho Action Guard (rẻ hơn)
custom_llm_mini: &custom_llm_mini
  provider: OpenAIChatCompletionClient
  config:
    base_url: "https://YOUR_PROVIDER_URL/v1"
    api_key: "YOUR_API_KEY_HERE"
    model: "your-smaller-model"  # Model nhỏ/rẻ hơn cho safety checks
    max_retries: 5

# =============================================================
# FARA-7B cho Web Surfer (Computer Use Agent)
# =============================================================
fara_client: &fara_client
  provider: OpenAIChatCompletionClient
  config:
    model: Fara-7B
    api_key: "not-needed"
    base_url: "http://localhost:8000/v1"
    max_retries: 10
    model_info:
      vision: true
      function_calling: true
      json_output: true
      family: "unknown"
      structured_output: false
      multiple_system_messages: false
  max_retries: 10

# =============================================================
# Client Assignments
# =============================================================

# Orchestrator: Điều phối - cần model mạnh
orchestrator_client: *custom_llm

# Coder: Viết code - cần model mạnh
coder_client: *custom_llm

# Web Surfer: Browse web - dùng FARA-7B
web_surfer_client: *fara_client

# File Surfer: Xem files
file_surfer_client: *custom_llm

# Action Guard: Safety checks - có thể dùng model nhỏ hơn
action_guard_client: *custom_llm_mini

# Plan Learning: Học từ interactions
plan_learning_client: *custom_llm
